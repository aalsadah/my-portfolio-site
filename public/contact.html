            <noscript>Form Error reporting and narrator announcing will not work with JavaScript disabled :&lpar;</noscript>
            <form id="contact-form" name="contact-form" title="contact form">
                <fieldset>
                    <legend>Send Me A Message!</legend>

                    <div class="field">
                        <label for="name">Enter Your Name: </label>
                        <input type="text" id="name" name="name" required minlength="1" maxlength="128" title="name field">
                        <span></span>
                        <output id="name-output" aria-live="polite"></output>
                    </div>

                    <div class="field">
                        <label for="email">Enter Your Email: </label>
                        <input type="email" name="email" id="email" required minlength="3" maxlength="128" title="email field">
                        <span></span>
                        <output id="email-output" aria-live="polite"></output>
                    </div>

                    <div class="field">
                        <label for="message">Enter Your Message: </label>
                        <textarea id="message" name="message" rows="5" cols="33" minlength="2" maxlength="1000" required title="message field">...Hello!</textarea>
                        <span></span>
                        <output id="message-output" aria-live="polite"></output>
                    </div>
                    <input type="hidden" name="form-errors" id="form-errors-json" value="">
                    <button type="submit" id="submit">send</button>
                </fieldset>
            </form>
